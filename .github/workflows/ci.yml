name: CI/CD - ImpactoTI Angular

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Pruebas y compilacion Angular
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npm test -- --watch=false

      - name: Compilar aplicacion Angular
        run: npm run build

      - name: Guardar artefacto de compilacion
        uses: actions/upload-artifact@v4
        with:
          name: impactoti-angular-build
          path: dist/impactoti-angular/browser/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Despliegue automatico a Netlify
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artefacto de compilacion
        uses: actions/download-artifact@v4
        with:
          name: impactoti-angular-build
          path: dist/impactoti-angular/browser/

      - name: Publicar aplicacion en Netlify
        run: npx --yes netlify-cli deploy --prod --dir=dist/impactoti-angular/browser --site="$NETLIFY_SITE_ID"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
